name: settleagent

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentguard
      POSTGRES_PASSWORD: agentguard
      POSTGRES_DB: agentguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    environment:
      DATABASE_URL: postgres://agentguard:agentguard@postgres:5432/agentguard?sslmode=disable
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      AG_DEMO_MOCKS: "1"
      PORT: "8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ../../apps/dashboard
    environment:
      SETTLEAGENT_API_URL: http://api:8080
      SETTLEAGENT_ORG_ID: org_demo
      SETTLEAGENT_OPERATOR_TOKEN: ${DASHBOARD_API_TOKEN:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      - api

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    command: ["--collector.otlp.enabled=true"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

volumes:
  pgdata:
